---
- name: SYSTEMCOLLECTIONPARAM | UPDATE | --check
  delegate_to: localhost
  register: result
  check_mode: true
  tags: test
  netscaler.adc.systemcollectionparam:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"

    communityname: public
    loglevel: WARNING

- name: Assert | SYSTEMCOLLECTIONPARAM | UPDATE | --check
  tags: test
  ansible.builtin.assert:
    that:
      - "result.failed==false"

- name: SYSTEMCOLLECTIONPARAM | UPDATE
  delegate_to: localhost
  register: result
  check_mode: false
  tags: test
  netscaler.adc.systemcollectionparam:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"

    communityname: public
    loglevel: WARNING

- name: Assert | SYSTEMCOLLECTIONPARAM | UPDATE
  tags: test
  ansible.builtin.assert:
    that:
      - "result.failed==false"

- name: SYSTEMCOLLECTIONPARAM | UPDATE | idempotent
  delegate_to: localhost
  register: result
  check_mode: false
  tags: test
  netscaler.adc.systemcollectionparam:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"

    communityname: public
    loglevel: WARNING

- name: Assert | SYSTEMCOLLECTIONPARAM | UPDATE | idempotent
  tags: test
  ansible.builtin.assert:
    that:
      - "result.failed==false"
      - "result.changed==false"
