---
- name: NSRUNNINGCONFIG | GET
  delegate_to: localhost
  register: result
  check_mode: false
  tags: test
  netscaler.adc.nsrunningconfig:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"

- name: Assert | NSRUNNINGCONFIG | GET
  tags: test
  ansible.builtin.assert:
    that:
      - "result.failed==false"

- name: NSRUNNINGCONFIG | GET | withdefaults
  delegate_to: localhost
  register: result
  check_mode: false
  tags: test
  netscaler.adc.nsrunningconfig:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"
    withdefaults: true

- name: Assert | NSRUNNINGCONFIG | GET | withdefaults
  tags: test
  ansible.builtin.assert:
    that:
      - "result.failed==false"
