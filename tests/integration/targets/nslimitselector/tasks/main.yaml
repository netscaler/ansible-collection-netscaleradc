---
- name: NSLIMITSELECTOR | ADD | --check
  delegate_to: localhost
  register: result
  check_mode: true
  tags: test
  netscaler.adc.nslimitselector:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"
    state: present
    selectorname: ansible_test_nslimitselector
    rule:
      - CLIENT.IP.SRC
- name: Assert | NSLIMITSELECTOR | ADD | --check
  tags: test
  ansible.builtin.assert:
    that:
      - "result.failed==false"
      - "result.changed==true"
