# ---------------------------------------------------------------------------
# legacy single-letter option names must still work (ansible-core 2.18 rename
# back-compat shim). This emits deprecation warnings but behaves identically.
#   M -> min_ttl, m -> max_ttl
#
# Same CPX caveat as the BASIC case above: the container may reject the actual
# traceroute with errorcode 33 / HTTP 599. The point of this case is that the
# legacy option names are still accepted and translated to the wire payload
# (M -> min_ttl, m -> max_ttl); that happens before the command is sent, so it
# is exercised regardless of whether the CPX can run the probe.
# ---------------------------------------------------------------------------
- name: TRACEROUTE | LEGACY OPTION NAMES (deprecated, still supported)
  delegate_to: localhost
  register: result
  failed_when: false
  netscaler.adc.traceroute:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"
    host: 127.0.0.1
    M: 1
    m: 1
    w: 2
    q: 1
    n: true
- name: Assert | TRACEROUTE | LEGACY OPTION NAMES
  ansible.builtin.assert:
    that:
      - >-
        (not result.failed and not result.changed
         and 'ms' in (result.traceroute.response | default('')))
        or
        ((result.msg | default('')) is search('errorcode.: 33'))
    success_msg: >-
      {{ 'traceroute (legacy option names) executed on the ADC' if (result.traceroute.response | default(''))
         else 'CPX raw-socket/ICMP limitation (errorcode 33) tolerated' }}
    fail_msg: >-
      Unexpected traceroute result: {{ result.msg | default(result.traceroute | default('')) }}
