---
# Integration tests for the `traceroute` operational utility module.
#
# `traceroute` is an operational (utility) resource: it runs the BSD `traceroute`
# command on the ADC and returns its output in the NITRO response body. It stores
# no config, so there is no add/update/absent/idempotency flow -- every invocation
# reports `changed=false`, and the assertions below check the returned output.
#
# Every task bounds the probe with max_ttl / w (wait) / q (queries) so the
# synchronous NITRO call cannot hang: the target is the loopback (one hop away).

# ---------------------------------------------------------------------------
# check mode: the diagnostic command must NOT be sent to the ADC.
# ---------------------------------------------------------------------------
- name: TRACEROUTE | CHECK MODE
  delegate_to: localhost
  register: result
  check_mode: true
  netscaler.adc.traceroute:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"
    host: 127.0.0.1
    max_ttl: 1
- name: Assert | TRACEROUTE | CHECK MODE
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - result.traceroute == {}

# ---------------------------------------------------------------------------
# basic traceroute of the ADC loopback, numeric output (new option names).
# ---------------------------------------------------------------------------
- name: TRACEROUTE | BASIC (numeric, new option names)
  delegate_to: localhost
  register: result
  netscaler.adc.traceroute:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"
    host: 127.0.0.1
    max_ttl: 1
    w: 2
    q: 1
    n: true
- name: Assert | TRACEROUTE | BASIC
  ansible.builtin.assert:
    that:
      - result.failed == false
      - result.changed == false
      - "'127.0.0.1' in result.traceroute.response"
      - "'ms' in result.traceroute.response"

