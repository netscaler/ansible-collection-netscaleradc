#
# SKIPPED in CI: the dockerized CPX used by the integration workflow cannot
# execute a summary-mode traceroute (raw-socket/privilege limitation), so the ADC
# returns NITRO errorcode 33 / HTTP 599. `summary: true` is a documented, valid
# option and works against a real VPX/MPX appliance -- re-enable this case when
