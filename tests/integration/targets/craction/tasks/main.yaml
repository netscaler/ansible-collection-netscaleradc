---
- name: CRACTION | GET | --check
  delegate_to: localhost
  register: result
  check_mode: true
  tags: test
  netscaler.adc.craction:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"
    state: present
    name: CACHE

- name: Assert | CRACTION | GET | --check
  tags: test
  ansible.builtin.assert:
    that:
      - "result.failed==false"

- name: CRACTION | GET
  delegate_to: localhost
  register: result
  check_mode: false
  tags: test
  netscaler.adc.craction:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"
    state: present
    name: CACHE

- name: Assert | CRACTION | GET
  tags: test
  ansible.builtin.assert:
    that:
      - "result.failed==false"

- name: CRACTION | GET | ORIGIN
  delegate_to: localhost
  register: result
  check_mode: false
  tags: test
  netscaler.adc.craction:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"
    state: present
    name: ORIGIN

- name: Assert | CRACTION | GET | ORIGIN
  tags: test
  ansible.builtin.assert:
    that:
      - "result.failed==false"
