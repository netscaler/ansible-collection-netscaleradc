---
- name: FILTERPOLICY | ADD | --check
  delegate_to: localhost
  register: result
  check_mode: true
  tags: test
  netscaler.adc.filterpolicy:
    nsip: "{{ nsip }}"
    nitro_user: "{{ nitro_user }}"
    nitro_pass: "{{ nitro_pass }}"
    nitro_protocol: "{{ nitro_protocol }}"
    validate_certs: "{{ validate_certs }}"
    save_config: "{{ save_config }}"
    state: present

    name: test_filterpolicy
    rule: "TRUE"

- name: Assert | FILTERPOLICY | ADD | --check
  tags: test
  ansible.builtin.assert:
    that:
      - "result.failed==false"
      - "result.changed==true"

