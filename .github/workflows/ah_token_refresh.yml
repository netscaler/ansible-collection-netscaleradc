---
name: Refresh the automation hub token
# the token expires every 30 days, so we need to refresh it
on:
  schedule:
    - cron: "0 12 1,15 * *"  # run 12pm on the 1st and 15th of the month
  workflow_dispatch:
permissions: read-all
jobs:
  refresh:
    # yamllint disable-line rule:line-length
    uses: ansible/ansible-content-actions/.github/workflows/refresh_ah_token.yaml@cbdec1f72eeee38b7e60d0f2346c66e622eea02a  # main
    with:
      environment: release
    secrets:
      ah_token: ${{ secrets.AH_TOKEN }}
